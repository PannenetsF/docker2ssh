name: Python Wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.0.1"
        required: true
  push:
    tags:
      - "v*"

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - name: Resolve package version
        id: resolve
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          package_name = "docker2ssh"
          raw = os.environ["RAW_VERSION"].strip()
          base = raw[1:] if raw.startswith("v") else raw

          if not re.match(r"^\d+\.\d+\.\d+$", base):
              raise SystemExit("version must look like vX.Y.Z or X.Y.Z")

          existing = set()
          url = "https://pypi.org/pypi/{}/json".format(package_name)
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  payload = json.load(response)
                  existing.update(payload.get("releases", {}).keys())
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          version = base
          if version in existing:
              post = 1
              while "{}.post{}".format(base, post) in existing:
                  post += 1
              version = "{}.post{}".format(base, post)

          print("package_version={}".format(version))
          PY

  build-linux-wheels:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            wheel_arch: x86_64
            wheel_tag: py3-none-manylinux_2_17_x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            wheel_arch: aarch64
            wheel_tag: py3-none-manylinux_2_17_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build static d2s binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Embed binary into Python package
        run: |
          cp target/${{ matrix.target }}/release/d2s python/src/docker2ssh/bin/d2s
          chmod +x python/src/docker2ssh/bin/d2s

      - name: Build wheel only
        working-directory: python
        env:
          D2S_PACKAGE_VERSION: ${{ needs.resolve-version.outputs.package_version }}
          D2S_WHEEL_TAG: ${{ matrix.wheel_tag }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_arch }}
          path: python/dist/*.whl

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - resolve-version
      - build-linux-wheels
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Show package version
        run: echo "Publishing version ${{ needs.resolve-version.outputs.package_version }}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
