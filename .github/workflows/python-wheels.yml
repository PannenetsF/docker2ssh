name: Python Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            wheel_arch: x86_64
            wheel_tag: py3-none-manylinux_2_17_x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            wheel_arch: aarch64
            wheel_tag: py3-none-manylinux_2_17_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build static d2s binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Embed binary into Python package
        run: |
          cp target/${{ matrix.target }}/release/d2s python/src/docker2ssh/bin/d2s
          chmod +x python/src/docker2ssh/bin/d2s

      - name: Build wheel only
        working-directory: python
        env:
          D2S_WHEEL_TAG: ${{ matrix.wheel_tag }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_arch }}
          path: python/dist/*.whl

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux-wheels
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
