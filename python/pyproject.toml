[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "docker2ssh"
version = "0.1.0"
description = "Python wrapper for the d2s docker2ssh binary"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "docker2ssh contributors" }
]
keywords = ["docker", "ssh", "remote", "devops", "container"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/PannenetsF/docker2ssh"

[project.scripts]
docker2ssh = "docker2ssh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docker2ssh"]
